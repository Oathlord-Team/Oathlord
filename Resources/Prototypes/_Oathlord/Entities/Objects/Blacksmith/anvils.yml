- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseAnvil
  description: An anvil.
  categories: [ ForkFiltered ]
  components:
  - type: Anvil
  - type: Sprite
    sprite: _Oathlord/Objects/Blacksmith/Smithing/anvils.rsi # todo: needs 4 directions
  - type: InteractionOutline
  - type: UserInterface
    interfaces:
      enum.AnvilUiKey.Key:
        type: AnvilBoundInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ActivatableUI
    key: enum.AnvilUiKey.Key
    singleUser: true
    verbOnly: true
    requiredItems:
      components:
      - Hammer
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Storage # Other option is to make this with item slots, but this is simpler
    storageOpenSound:
      path: /Audio/_Oathlord/Blacksmith/Smithing/anvil_storage.ogg
      params:
        volume: -6
    storageCloseSound: null
    storageInsertSound: null
    storageRemoveSound: null
    grid:
    - 0,0,1,1
    clickInsert: true
    whitelist:
      components:
      - MetalWorkable

- type: entity
  parent: BaseAnvil
  id: Anvil
  name: Anvil
  components:
  - type: Sprite
    state: anvil_black
  - type: Anvil
    numbers: [ -9, -7, -3, -1, 1, 3, 7, 9 ]
