- type: entity
  id: FloorVaultEntity
  name: vault
  description: A magical tile that detects all the goods.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  categories: [ ForkFiltered ]
  components:
  - type: VaultTile
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: Tiles/TileEntities/liquid-lava.rsi
    drawdepth: BelowFloor
  - type: Icon
    sprite: Tiles/TileEntities/liquid-lava.rsi
    state: full
  - type: IconSmooth
    key: lava
    states:
    - !type:CornerSpriteSmoothing
      mask: [ lava, walls ]
      base: water
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - ItemMask
        density: 1000
        hard: false
  - type: Tag
    tags:
    - HideContextMenu
  - type: PlacementReplacement
    key: tileOverlay
