- type: entity
  parent: BaseTemporaryHitbox
  id: DebugHitbox
  components:
  - type: Hitbox
    damage:
      types:
        Heat: 2.5
  - type: Fixtures
    fixtures:
      hitbox:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        hard: false
        mask:
        - MobMask
        layer:
        - Impassable
        restitution: 0.3
        friction: 0.2

