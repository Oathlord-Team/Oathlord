- type: entity
  parent: [ BaseTemporaryHitbox, BaseHitboxSlashEffect ]
  id: DebugHitbox
  components:
  - type: Sprite
    state: slash_small
    rotation: 180
  - type: ScaleVisuals
    scale: 0.5,0.5
  - type: TimedDespawn
    lifetime: 0.7
  - type: Hitbox
    damageConfig:
      damage:
        types:
          Heat: 2.5
  - type: Fixtures
    fixtures:
      hitbox:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        hard: false
        mask:
        - MobMask

- type: entity
  parent: [ BaseTemporaryHitbox, BaseHitboxSlashEffect]
  id: DebugHitbox2
  components:
  - type: Sprite
    state: slash_wide
    rotation: 180
    offset: 0.1,0
  - type: TimedDespawn
    lifetime: 0.9
  - type: Hitbox
    damageConfig:
      damage:
        types:
          Heat: 5
  - type: Fixtures
    fixtures:
      hitbox:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-1,0.5,0.5"
        density: 20
        hard: false
        mask:
        - MobMask
