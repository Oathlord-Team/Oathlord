name: Report an mapping issue
description: For issues regarding mapping.
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out an issue. This template is intended for any issues related to mapping.
        For feedback or help running Oathlord, please join our [Discord](https://discord.gg/wsVcuN7Cdv).
  - type: input
    attributes:
      label: On what map, or grid did the issue occur on?
      description: The name of the map, or grid. If you do not know the name, try to describe it.
      placeholder: Wruck
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: |
        A clear and concise description of what the issue is.
        If the issue is visual in nature, consider posting a screenshot.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: List the steps required to reproduce the issue.
      placeholder: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other additional context about the issue here.
    validations:
      required: false
